# Production Docker Compose Configuration
# Dùng khi deploy lên AWS EC2 hoặc VPS tương tự

version: "3.9"

services:
  # ============ API Gateway ============
  api-gateway:
    image: bookstore/api-gateway:latest
    build: ./api-gateway
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=gateway_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DEBUG=False
      - ALLOWED_HOSTS=*
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookstore
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ Core Services ============
  customer-service:
    image: bookstore/customer-service:latest
    build: ./customer-service
    ports:
      - "8001:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=customer_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookstore

  book-service:
    image: bookstore/book-service:latest
    build: ./book-service
    ports:
      - "8002:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=book_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookstore

  cart-service:
    image: bookstore/cart-service:latest
    build: ./cart-service
    ports:
      - "8003:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=cart_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookstore

  staff-service:
    image: bookstore/staff-service:latest
    build: ./staff-service
    ports:
      - "8004:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=staff_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookstore

  # ============ Services with RabbitMQ ============
  order-service:
    image: bookstore/order-service:latest
    build: ./order-service
    ports:
      - "8005:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=order_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookstore

  order-consumer:
    image: bookstore/order-service:latest
    build: ./order-service
    command: ["python", "manage.py", "run_consumer"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=order_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookstore

  pay-service:
    image: bookstore/pay-service:latest
    build: ./pay-service
    ports:
      - "8006:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=pay_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookstore

  pay-consumer:
    image: bookstore/pay-service:latest
    build: ./pay-service
    command: ["python", "manage.py", "run_consumer"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=pay_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookstore

  ship-service:
    image: bookstore/ship-service:latest
    build: ./ship-service
    ports:
      - "8007:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=ship_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookstore

  ship-consumer:
    image: bookstore/ship-service:latest
    build: ./ship-service
    command: ["python", "manage.py", "run_consumer"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=ship_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookstore

  # ============ Additional Services ============
  comment-rate-service:
    image: bookstore/comment-rate-service:latest
    build: ./comment-rate-service
    ports:
      - "8008:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=comment_rate_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookstore

  manager-service:
    image: bookstore/manager-service:latest
    build: ./manager-service
    ports:
      - "8009:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=manager_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookstore

  catalog-service:
    image: bookstore/catalog-service:latest
    build: ./catalog-service
    ports:
      - "8010:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=catalog_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookstore

  recommender-ai-service:
    image: bookstore/recommender-ai-service:latest
    build: ./recommender-ai-service
    ports:
      - "8011:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=recommender_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookstore

  image-service:
    image: bookstore/image-service:latest
    build: ./image-service
    ports:
      - "8012:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=image_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookstore
    volumes:
      - ./uploads:/app/uploads  # Persistent storage cho images

  # ============ Image Worker (Celery) ============
  image-worker:
    image: bookstore/image-service:latest
    build: ./image-service
    command: ["celery", "-A", "image_service", "worker", "--loglevel=info"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=image_db
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bookstore
    volumes:
      - ./uploads:/app/uploads

  # ============ PostgreSQL ============
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_INITDB_ARGS=-c log_statement=all
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/init.sh
    restart: unless-stopped
    networks:
      - bookstore
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ RabbitMQ ============
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - bookstore
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============ Redis ============
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - bookstore
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ Nginx Reverse Proxy ============
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - bookstore
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  bookstore:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  nginx_cache:
